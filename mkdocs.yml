site_name: School Science Lessons
site_description: >-
  Science experiments and lessons for primary and high schools — physics,
  chemistry, biology, geology, agriculture and more. By Dr John Elfick,
  School of Education, University of Queensland.
site_url: https://johnelfick.github.io/school-science-lessons-web/
site_author: Dr John Elfick

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Source Sans 3
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
  icon:
    logo: material/flask-outline

extra_css:
  - assets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - toc:
      permalink: true

plugins:
  - search

